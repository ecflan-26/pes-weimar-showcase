<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>PES Weimar - workflow demo</title><link rel="stylesheet" href="style.css"><script defer src="../src/workflow.js"></script><script defer src="demo.js"></script></head>
<body><main><p class="eyebrow">EARL FLANAGAN / PES WEIMAR</p><h1>Clear communication.<br>A practical next step.</h1><p id="intro">A fictional enquiry workflow for a training business.</p><button type="button" id="language">Deutsch</button><aside id="notice">Portfolio demo only. Use invented details. Nothing is sent or stored.</aside><form id="demo-form"><label for="name" id="name-label">Fictional name</label><input id="name" required maxlength="100" autocomplete="off"><label for="offer" id="offer-label">Service</label><select id="offer"><option value="meeting">Meeting rehearsal</option><option value="presentation">Presentation review</option><option value="programme">Training programme</option></select><label for="goal" id="goal-label">What would you like to prepare?</label><textarea id="goal" required maxlength="2000" rows="4"></textarea><button type="submit" id="preview">Preview enquiry</button></form><p id="status" role="status" aria-live="polite"></p><pre id="result" hidden></pre><footer>Sanitized sample · AI-assisted implementation · No external services</footer></main></body></html>
